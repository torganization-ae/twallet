# Temporarily disabled (manual trigger only): the hardcoded lint targets below
# (NetworksVC.kt, MRpcNetworks.kt, SDKApiMethod.kt, UISettings/Networks) predate
# ktlint/SwiftLint being run here and aren't clean, so every PR touching mobile/**
# fails on pre-existing violations unrelated to the actual change.
# Re-enable by restoring the `push`/`pull_request` triggers once that debt is fixed.
name: Lint Native

on:
  workflow_dispatch:

jobs:
  android-ktlint:
    name: Android ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ktlint
        run: |
          npm run lint:android -- \
            mobile/android/air/SubModules/UISettings/src/main/java/app/twallet/air/uisettings/viewControllers/networks \
            mobile/android/air/SubModules/WalletCore/src/main/java/app/twallet/air/walletcore/moshi/moshi/MRpcNetworks.kt \
            mobile/android/air/SubModules/WalletSDK/src/main/java/app/twallet/air/walletsdk/methods/SDKApiMethod.kt

  android-detekt:
    name: Android detekt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: detekt
        run: |
          npm run lint:android:detekt -- \
            mobile/android/air/SubModules/UISettings/src/main/java/app/twallet/air/uisettings/viewControllers/networks

  ios-swiftlint:
    name: iOS SwiftLint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: npm run lint:ios -- mobile/ios/Air/SubModules/UISettings/Networks
