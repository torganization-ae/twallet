productName: "Twallet"
# Without this key electron-builder derives the copyright from package.json `author`.
copyright: "Copyright © 2026 Twallet"
# Pinned by config.test.ts: change ONLY together with ARTIFACT_NAME_BASE in
# package-and-publish.yml (workflow artifact names must match electron-builder output) and the
# get.mywallet.io download page. Renaming is safe for installed clients: the update feed
# (latest*.yml) and the files it points at are generated together into the same release, so old
# clients download whatever name the new feed declares.
artifactName: "Twallet-${arch}.${ext}"
appId: "app.twallet.electron"
extraMetadata:
  main: "./dist/electron.js"
  # Sole source of `app.getName()`, which keys `app.getPath('userData')` (the IndexedDB holding every
  # wallet) and the macOS keychain entry `<name> Safe Storage`. This is a hard fork — we do NOT carry
  # over upstream desktop installs, so the identity is rebranded to Twallet and starts clean.
  productName: "Twallet"
files:
  - "dist"
  - "package.json"
  - "public/icon-256x256.png"
  - "public/icon-32x32.png"
  - "public/icon-electron-windows.ico"
  - "public/icon-electron-macos.icns"
  - "!dist/get"
  - "!node_modules"
directories:
  buildResources: "./public"
  output: "./dist-electron"
protocols:
  - name: "Ton"
    schemes: ["ton"]
  - name: "TonConnect"
    schemes: ["tc"]
  - name: "TonConnect Twallet"
    schemes: ["twallet-tc"]
  - name: "Twallet"
    schemes: ["mtw"]
  - name: "WalletConnect"
    schemes: ["wc"]
  - name: "WalletConnect Twallet"
    schemes: ["twallet-wc"]
publish:
  provider: "github"
  owner: "torganization-ae"
  repo: "twallet"
  releaseType: "draft"
win:
  target:
    - target: "nsis"
      arch:
        - x64
  icon: "public/icon-electron-windows.ico"
nsis:
  oneClick: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    target: "default"
    arch: ["x64", "arm64"]
  entitlements: "public/electron-entitlements.mac.plist"
  icon: "public/icon-electron-macos.icns"

dmg:
  title: "Twallet installer"
  background: "public/background-electron-dmg.tiff"
  contents:
    - x: 148
      y: 180
      type: "file"
    - x: 392
      y: 180
      type: "link"
      path: "/Applications"
linux:
  category: "Cryptocurrencies"
  target:
    - target: "AppImage"
      arch:
        - x64
        - arm64
  icon: "public/icon-256x256.png"
