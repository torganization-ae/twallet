disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - todo
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - large_tuple
  - multiple_closures_with_trailing_closure
  - nesting
  - opening_brace
  - vertical_whitespace
  - vertical_parameter_alignment_on_call
  - vertical_parameter_alignment

opt_in_rules:
  - empty_count
  - empty_string_checks
  - first_where
  - last_where
  - prefer_self_in_static_references

excluded:
  - "**/Pods/**"
  - "**/DerivedData/**"
  - "**/.build/**"
  - "**/Tests/**"

reporter:
  - emoji: false
  - html: false
  - xcode: true

line_length:
  warning: 160
  error: 250
  ignores_comments: true
  ignores_urls: true
